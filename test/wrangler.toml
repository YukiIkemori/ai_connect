# Local test configuration only (never deployed).
name = "ai-relay-test"
main = "../src/index.ts"
compatibility_date = "2025-09-01"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ai-relay-test"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../migrations"

[vars]
AGENTS = '{"Dots":{"mode":"push"},"Grok":{"mode":"push"},"Muse":{"mode":"pull"},"ChatGPT":{"mode":"sheet"},"Claude":{"mode":"push","format":"text","headers":{"anthropic-version":"2023-06-01"}}}'
MAX_HOPS = "3"
MAX_ATTEMPTS = "3"
RETRY_BASE_SECONDS = "1"
RETRY_CAP_SECONDS = "4"
DEFAULT_TTL_SECONDS = "3600"
DAILY_EVENT_LIMIT = "40"
REQUIRE_SIGNATURE = "false"
APPROVAL_ACTIONS = "dm_reply,dm_send,post,delete,billing,purchase"
ALLOW_INSECURE_TARGETS = "true"
